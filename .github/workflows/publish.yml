name: Publish

# Publishes to npm when a version tag is pushed (the release:* scripts do that).
# Uses npm trusted publishing (OIDC): no token is stored in the repository and the
# account's 2FA is not involved. It has to be enabled once on npmjs.com:
# package easy-sipjs → Settings → Trusted Publisher → GitHub Actions,
# repository phs-santos/easy-sipjs, workflow file publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # prepublishOnly runs lint, tests and the build.
      - run: npm publish --access public
